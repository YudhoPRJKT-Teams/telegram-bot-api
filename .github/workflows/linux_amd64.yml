name: Auto Build Telegram Bot API Server For Linux amd64/x86_64
'on':
  push:
    branches:
      - master
      - main
  workflow_dispatch: 

env:
  PACKAGE_NAME: linux-telegram-bot-api
  PACKAGE_VERSION: '1.0.${{ github.run_number }}'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Debian Container
        uses: addnab/docker-run-action@v3
        with:
          image: debian:bookworm
          options: -v ${{ github.workspace }}:/work -v /root/.cache/ccache:/root/.cache/ccache
          run: |
            apt-get update
            apt-get install -y make git zlib1g-dev libssl-dev gperf cmake clang libc++-dev libc++abi-dev ccache zip curl
            
            cd /work
            
            ccache -M 20G
            mkdir -p build && cd build
            
            CXXFLAGS="-stdlib=libc++" \
            CC=/usr/bin/clang \
            CXX=/usr/bin/clang++ \
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX:PATH=/usr/local \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                  ..
            
            cmake --build . --target install -- -j$(nproc)
            zip -j /work/linux-telegram_bot_api.zip /usr/local/bin/telegram-bot-api

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: linux-telegram_bot_api.zip
          tag_name: 'v${{ env.PACKAGE_VERSION }}'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
